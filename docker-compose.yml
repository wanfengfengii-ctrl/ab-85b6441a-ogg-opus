# Compose layout for the Ogg Opus audit service.
#
# Services:
#   api     - long-running HTTP API, health-checked via GET /health.
#             Host port is configurable through OPUS_AUDIT_HOST_PORT.
#   verify  - one-shot job: waits until api is healthy, then runs the Go
#             tests, the production build and the HTTP smoke suite
#             (including a cross-page audio packet). Its aggregated exit
#             code is the verification result.
#
# Examples:
#   docker compose up -d --build api
#   OPUS_AUDIT_HOST_PORT=9090 docker compose up -d --build api
#   docker compose build verify && docker compose up --build verify

services:
  api:
    build:
      context: .
      target: runtime
    image: opus-audit:latest
    container_name: opus-audit-api
    ports:
      # Configurable host port; container port stays 8080.
      - "${OPUS_AUDIT_HOST_PORT:-8080}:8080"
    environment:
      OPUS_AUDIT_ADDR: ":8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  verify:
    build:
      context: .
      target: verify
    image: opus-audit-verify:latest
    container_name: opus-audit-verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      AUDIT_BASE_URL: "http://api:8080"
    restart: "no"
